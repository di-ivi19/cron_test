name: Job Concurrency

on:
   push:
   workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-group
      cancel-in-progress: false
    steps:
      - run: echo "Build"

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-group
      cancel-in-progress: true
    steps:
      - run: echo "Test"

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy"
