
name: Different Concurrency Groups

on:
  workflow_dispatch:
  push:

jobs:
  job_01:
    name: Job 01 - Group A
    runs-on: ubuntu-latest
    concurrency:
      group: group-A
    #  cancel-in-progress: false
    steps:
      - name: Execute Job 01
        run: |
          echo "Job 01 - Group A"
          sleep 30

  job_02:
    name: Job 02 - Group A
    runs-on: ubuntu-latest
    concurrency:
      group: group-A
 #  cancel-in-progress: false
    steps:
      - name: Execute Job 02
        run: |
          echo "Job 02 - Group A"
          sleep 30

  job_03:
    name: Job 03 - Group B
    runs-on: ubuntu-latest
    concurrency:
      group: group-B
     #  cancel-in-progress: false
