name: Проверка matrix. Исключение определенных комбинаций

on:
  workflow_dispatch:

jobs:
  strategy:
    matrix:
      os: [ubuntu-latest, img-ubuntu-latest]
      node: [12, 14, 16]
      exclude:
        - os: ubuntu-latest
          node: 12
        - os: img-ubuntu-latest
          node: 16

    runs-on: ${{ matrix.os }}

    steps:
      - run: echo "Running on ${{ matrix.os }} with Node.js ${{ matrix.node }}"
