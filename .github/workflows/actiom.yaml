name: TC-04 Cancel In Progress

on:
  workflow_dispatch:

jobs:
  job_01:
    name: Job 01 - First Run
    runs-on: ubuntu-latest
    concurrency:
      group: cancel-test
      cancel-in-progress: true
    steps:
      - run: |
          echo "First job started"
          sleep 180
          echo "First job finished"

  job_02:
    name: Job 02 - Second Run
    runs-on: ubuntu-latest
    concurrency:
      group: cancel-test
      cancel-in-progress: true
    steps:
      - run: |
          echo "Second job started"
          sleep 30
