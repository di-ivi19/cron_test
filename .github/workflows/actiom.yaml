      - name: Execute Job 03
        run: |
          echo "Job 03 - Group B"
          sleep 30

  job_04:
    name: Job 04 - Group B
    runs-on: ubuntu-latest
    concurrency:
      group: group-B
      #  cancel-in-progress: false
    steps:
      - name: Execute Job 04
        run: |
          echo "Job 04 - Group B"
          sleep 30

  job_05:
